# Flaught — Adversarial Review (unprivileged, runs the fork's code)
#
# Dogfooding: runs Flaught against every PR to this repo.
# Builds from the branch source (npm link) so that PRs which change
# Flaught's own review/dismissal/test-inversion/refute logic are
# reflected in their own CI run.
#
# This workflow runs the untrusted PR code in a sandbox with a read-only
# token and NO access to repository secrets (the GitHub default for
# pull_request events from forks).
#
# Two paths, selected by whether GROQ_API_KEY is available (same-repo PRs
# have it; fork PRs do not):
#
#   same-repo PR (key present):
#     Run the FULL review here — LLM + refute + --github-inline — and
#     render the comment body. The privileged workflow_run just posts it.
#     (The fork's code runs only in this sandboxed, no-secret job, and
#     only for same-repo PRs is the token write-capable for inline comments.)
#
#   fork PR (key absent):
#     Run --no-llm and EMIT a context bundle (context.json) alongside the
#     deterministic findings.json. The LLM pass can't run here (no secret),
#     so it runs in the privileged adversarial-review-comment.yml via
#     `flaught review --only-llm --context context.json` — which loads the
#     diff as DATA (never checking out the fork's code) and calls the LLM
#     with the secret key. See core-8fz.
#
# Exit code 1 (findings exceed severity gate) blocks merge here (the
# Check severity gate step). For fork PRs this gates on deterministic
# findings; LLM findings are posted as an advisory comment by the
# privileged half (not a blocking check — a known v1 limitation).

name: Adversarial Review

on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # for --github-inline on same-repo PRs (fork PRs get read-only regardless)
      contents: read

    steps:
      # actions/checkout@v7.0.1 — pinned to commit SHA for supply-chain integrity
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # actions/setup-node@v6.5.0 — pinned to commit SHA for supply-chain integrity
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Build Flaught from source
        run: |
          npm ci
          npm run build
          npm link

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run adversarial review
        id: review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        # Shell-injection-safe: all GitHub expressions passed via env vars, not interpolated inline.
        # set +e / explicit exit 0: the step's own pass/fail no longer gates the job — the two Check
        # steps below branch on exit_code so exit 1 (findings) and exit 2 (tool/LLM error) differ.
        #
        # Two paths: if the GROQ key is present (same-repo PR) run the full LLM review inline;
        # if absent (fork PR) run --no-llm and EMIT a context bundle for the privileged half to
        # run the LLM pass against (core-8fz fork-PR split).
        run: |
          set +e
          if [ -n "$GROQ_API_KEY" ]; then
            flaught review \
              --base "origin/${PR_BASE_REF}" \
              --head HEAD \
              --output findings.json \
              --pr-description "${PR_TITLE}" \
              --github-inline \
              --quiet
          else
            echo "No GROQ_API_KEY (fork PR) — running deterministic-only and emitting a context bundle for the privileged LLM half."
            flaught review \
              --no-llm \
              --emit-context context.json \
              --base "origin/${PR_BASE_REF}" \
              --head HEAD \
              --output findings.json \
              --pr-description "${PR_TITLE}" \
              --quiet
          fi
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ -f context.json ]; then echo "split=true" >> "$GITHUB_OUTPUT"; else echo "split=false" >> "$GITHUB_OUTPUT"; fi
          # Always exit 0 — we check the exit code in later steps
          exit 0

      - name: Render review comment body (same-repo path only)
        if: always() && steps.review.outputs.split != 'true'
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        # Only for same-repo PRs: the full review above already wrote findings.json (with LLM
        # findings). This re-runs --no-llm to render the markdown comment body. For fork PRs the
        # comment body is rendered by the privileged half (which has the LLM findings).
        run: |
          if [ -f findings.json ]; then
            set +e
            if ! flaught review \
              --base "origin/${PR_BASE_REF}" \
              --head HEAD \
              --no-llm \
              --pr-description "${PR_TITLE}" \
              --quiet > review-body.md 2>/dev/null \
              || [ ! -s review-body.md ]; then
              echo "Review could not be rendered." > review-body.md
            fi
          else
            echo "⚠️ Flaught review failed to produce findings. Check the workflow logs for details." > review-body.md
          fi

      - name: Save PR metadata
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' "$PR_NUMBER" > pr-number.txt

      # actions/upload-artifact@v7.0.1 — pinned to commit SHA for supply-chain integrity
      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flaught-findings
          path: findings.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload PR metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flaught-pr-meta
          path: pr-number.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Upload context bundle (fork-PR split)
        if: always() && steps.review.outputs.split == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flaught-context
          path: context.json
          retention-days: 14

      - name: Upload rendered comment (same-repo path)
        if: always() && steps.review.outputs.split != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flaught-review-comment
          path: review-body.md
          retention-days: 14
          if-no-files-found: warn

      - name: Check severity gate
        if: steps.review.outputs.exit_code == '1'
        run: |
          echo "::error::Flaught found findings that exceed the severity gate threshold"
          exit 1

      - name: Check for errors
        if: steps.review.outputs.exit_code == '2'
        run: |
          echo "::warning::Flaught encountered an error (config, API, or runtime) and could not complete the review. This does NOT block merge — an LLM/infra outage is not evidence of a real code problem. Check the workflow logs and consider re-running."