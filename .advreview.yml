# Flaught adversarial review configuration
# https://github.com/flaught/core

version: 1

# ── LLM provider ───────────────────────────────────────────
# Groq: fast, cheap, OpenAI-compatible API. Requires GROQ_API_KEY secret.
# Available models (as of Aug 2026): openai/gpt-oss-20b,
# openai/gpt-oss-120b, groq/compound, groq/compound-mini
# GPT-OSS models support JSON mode on Groq.
llm:
  provider: groq
  model: openai/gpt-oss-20b # good balance of speed and quality; also try: openai/gpt-oss-120b
  api_key_env: GROQ_API_KEY
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 120

# ── Refute pass (skeptic) ────────────────────────────────────
# Same-provider anti-correlation: the skeptic runs on a different Groq
# model (120b, not the 20b that wrote the findings) rather than the exact
# model that just reviewed the diff grading its own homework. `provider`
# is left unset so it inherits `llm.provider` (groq) — only `model` differs.
refute:
  model: openai/gpt-oss-120b

# ── Deterministic tools ────────────────────────────────────
tools:
  semgrep:
    enabled: true
  linter:
    enabled: true
  vuln_scanner:
    enabled: true

# ── Test inversion ──────────────────────────────────────────
test_inversion:
  enabled: true

# ── Scope-creep detection ─────────────────────────────────
scope_creep:
  enabled: true
  intent_source: pr_description

# ── Noise budget ────────────────────────────────────────────
noise_budget:
  critical: 3
  high: 5
  medium: 10
  low: 15
  info: 20

# ── Severity gate ──────────────────────────────────────────
severity_gate:
  fail_on: high

# ── Dismissals ───────────────────────────────────────────────
dismissals:
  enabled: true
  path: .flaught-dismissals.json

# ── Prompt templates ────────────────────────────────────────
prompt:
  enabled: true
  path: .flaught-prompt

# ── Exclusions ─────────────────────────────────────────────
exclude:
  paths:
    - "node_modules/**"
    - "dist/**"
    - "coverage/**"
    - "**/*.test.ts"
    - "**/*.test.js"