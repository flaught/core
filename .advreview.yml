# Flaught adversarial review configuration
# https://github.com/flaught/core

version: 1

# ── LLM provider ───────────────────────────────────────────
# Groq: fast, cheap, OpenAI-compatible API. Requires GROQ_API_KEY secret.
# Available models (as of Aug 2026): llama-3.3-70b-versatile, openai/gpt-oss-120b,
# openai/gpt-oss-20b, meta-llama/llama-4-maverick-17b-128e-instruct,
# moonshotai/kimi-k2-instruct-0905, qwen/qwen3-32b
# GPT-OSS models support JSON mode but may require reasoning_effort on Groq.
llm:
  provider: groq
  model: llama-3.3-70b-versatile # strongest coding model on Groq; also try: meta-llama/llama-4-maverick-17b-128e-instruct
  api_key_env: GROQ_API_KEY
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 120

# ── Deterministic tools ────────────────────────────────────
tools:
  semgrep:
    enabled: true
  linter:
    enabled: true
  vuln_scanner:
    enabled: true

# ── Test inversion ──────────────────────────────────────────
test_inversion:
  enabled: true

# ── Scope-creep detection ─────────────────────────────────
scope_creep:
  enabled: true
  intent_source: pr_description

# ── Noise budget ────────────────────────────────────────────
noise_budget:
  critical: 3
  high: 5
  medium: 10
  low: 15
  info: 20

# ── Severity gate ──────────────────────────────────────────
severity_gate:
  fail_on: high

# ── Dismissals ───────────────────────────────────────────────
dismissals:
  enabled: true
  path: .flaught-dismissals.json

# ── Prompt templates ────────────────────────────────────────
prompt:
  enabled: true
  path: .flaught-prompt

# ── Exclusions ─────────────────────────────────────────────
exclude:
  paths:
    - "node_modules/**"
    - "dist/**"
    - "coverage/**"
    - "**/*.test.ts"
    - "**/*.test.js"